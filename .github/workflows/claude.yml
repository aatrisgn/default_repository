# Managed by the landing zone. Do not edit in this repository.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

# One agent run per issue/PR at a time; later tags queue instead of racing.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude') ||
      (github.event_name == 'issues' && github.event.label.name == 'claude')
    uses: aatrisgn/TGC.Templates/.github/workflows/claude-agent.yml@main
    with:
      runs-on: ${{ vars.AGENT_RUNS_ON || 'ubuntu-latest' }}
      node-version: '22'
    secrets: inherit
